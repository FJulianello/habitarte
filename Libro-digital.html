document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

er;opacity:.5;font:300 8px/1 'Jost',sans-serif;letter-spacing:.32em\" style-hover=\"opacity:1\">BELGRANO R<\u002Fspan>\n      <span data-chap=\"13\" style=\"cursor:pointer;opacity:.5;font:300 8px/1 'Jost',sans-serif;letter-spacing:.32em\" style-hover=\"opacity:1\">RECOLETA<\u002Fspan>\n      <span data-chap=\"17\" style=\"cursor:pointer;opacity:.5;font:300 8px/1 'Jost',sans-serif;letter-spacing:.32em\" style-hover=\"opacity:1\">MATERIALES · COLOFÓN<\u002Fspan>\n    <\u002Fdiv>\n    <div data-navrow=\"\" style=\"display:flex;justify-content:center;align-items:center;gap:26px\">\n      <span sc-camel-on-click=\"{{ prev }}\" style=\"cursor:pointer;opacity:.7\" style-hover=\"opacity:1\">← ANTERIOR<\u002Fspan>\n      <span ref=\"{{ folioRef }}\" style=\"opacity:.5;min-width:9ch;text-align:center\">I / XX<\u002Fspan>\n      <span sc-camel-on-click=\"{{ next }}\" style=\"cursor:pointer;opacity:.7\" style-hover=\"opacity:1\">SIGUIENTE →<\u002Fspan>\n    <\u002Fdiv>\n    <span data-hint=\"\" style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.4em;opacity:.4\">ARRASTRÁ LA ESQUINA DE LA HOJA<\u002Fspan>\n  <\u002Fdiv>\n\n  <div ref=\"{{ srcRef }}\" style=\"display:none\">\n\n    <div data-pg=\"\" data-density=\"hard\" data-cover=\"\" style=\"background:#5c1a22\">\n      <div style=\"height:100%;box-sizing:border-box;padding:14% 12%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;text-align:center;background:linear-gradient(100deg,#4e151c 0%,#5c1a22 55%,#45121a 100%)\">\n        <img src=\"3f8aa1eb-e3d7-4754-a77d-760f50fcb987\" alt=\"Habitarte\" style=\"width:min(180px,52%);aspect-ratio:1/1;height:auto;display:block;object-fit:contain\">\n        <p style=\"font:200 clamp(19px,2.1vw,30px)/1.45 'Cormorant',serif;font-style:italic;color:#f0ebe2;margin:0;max-width:22ch\">La casa antes del plano<\u002Fp>\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.44em;color:rgba(240,235,226,.5)\">VOLUMEN I · MMXXVI<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" style=\"background:#ded6c6\">\n      <div style=\"height:100%;box-sizing:border-box;padding:16% 13%;display:flex;flex-direction:column;justify-content:flex-end;background:#ded6c6\">\n        <span style=\"font:200 clamp(15px,1.4vw,21px)/1.5 'Cormorant',serif;font-style:italic;color:rgba(42,38,34,.5)\">Buenos Aires — tres casas, una manera de mirar.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" style=\"background:#e6dfd0\">\n      <div style=\"height:100%;box-sizing:border-box;padding:13% 12%;display:flex;flex-direction:column;justify-content:center;background:#e6dfd0\">\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.44em;color:#8a6a4a;margin-bottom:6%\">ÍNDICE<\u002Fspan>\n        <div style=\"display:flex;align-items:baseline;gap:14px;border-top:1px solid rgba(42,38,34,.14);padding:11px 0\">\n          <span style=\"font:300 9px/1 'Jost',sans-serif;letter-spacing:.3em;color:#8a6a4a;width:26px;flex:none\">I<\u002Fspan>\n          <span style=\"font:200 clamp(15px,1.45vw,22px)/1.25 'Cormorant',serif;flex:1\">Antes de dibujar, escuchamos<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:14px;border-top:1px solid rgba(42,38,34,.14);padding:11px 0\">\n          <span style=\"font:300 9px/1 'Jost',sans-serif;letter-spacing:.3em;color:#8a6a4a;width:26px;flex:none\">II<\u002Fspan>\n          <span style=\"font:200 clamp(15px,1.45vw,22px)/1.25 'Cormorant',serif;flex:1\">Palermo Soho<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:14px;border-top:1px solid rgba(42,38,34,.14);padding:11px 0\">\n          <span style=\"font:300 9px/1 'Jost',sans-serif;letter-spacing:.3em;color:#8a6a4a;width:26px;flex:none\">III<\u002Fspan>\n          <span style=\"font:200 clamp(15px,1.45vw,22px)/1.25 'Cormorant',serif;flex:1\">Belgrano R<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:14px;border-top:1px solid rgba(42,38,34,.14);padding:11px 0\">\n          <span style=\"font:300 9px/1 'Jost',sans-serif;letter-spacing:.3em;color:#8a6a4a;width:26px;flex:none\">IV<\u002Fspan>\n          <span style=\"font:200 clamp(15px,1.45vw,22px)/1.25 'Cormorant',serif;flex:1\">Recoleta<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:14px;border-top:1px solid rgba(42,38,34,.14);border-bottom:1px solid rgba(42,38,34,.14);padding:11px 0\">\n          <span style=\"font:300 9px/1 'Jost',sans-serif;letter-spacing:.3em;color:#8a6a4a;width:26px;flex:none\">V<\u002Fspan>\n          <span style=\"font:200 clamp(15px,1.45vw,22px)/1.25 'Cormorant',serif;flex:1\">Materiales, colofón y contacto<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.36em;color:rgba(42,38,34,.4);margin-top:auto;padding-top:7%\">III<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" style=\"background:#e6dfd0\">\n      <div style=\"height:100%;box-sizing:border-box;padding:13% 12%;display:flex;flex-direction:column;justify-content:center;background:#e6dfd0\">\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.44em;color:#8a6a4a\">PRÓLOGO<\u002Fspan>\n        <p style=\"font:200 clamp(16px,1.7vw,25px)/1.4 'Cormorant',serif;margin:5% 0 0;color:#2a2622\">Una casa no se decora: se interpreta. Observamos la luz, los hábitos y los silencios antes de dibujar una sola línea.<\u002Fp>\n        <p style=\"font:300 clamp(10px,1.05vw,12px)/1.95 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:6% 0 0\">Tres viviendas de Buenos Aires contadas como se cuentan las historias: por la luz que entra, por las manos que las hicieron y por la gente que las gastó.<\u002Fp>\n        <p style=\"font:300 clamp(10px,1.05vw,12px)/1.95 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:3.5% 0 0\">Ninguna empezó con un plano. Empezaron con una conversación larga, en la cocina, sobre cómo querían vivir sus dueños dentro de diez años.<\u002Fp>\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.36em;color:rgba(42,38,34,.4);margin-top:auto;padding-top:7%\">IV<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" style=\"background:#e6dfd0\">\n      <div style=\"height:100%;box-sizing:border-box;padding:12% 12%;display:flex;flex-direction:column;justify-content:flex-start;background:#e6dfd0\">\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.44em;color:#8a6a4a;margin-bottom:6%\">ANTES DE DIBUJAR, ESCUCHAMOS<\u002Fspan>\n        <p style=\"font:300 clamp(10px,1.05vw,12px)/1.95 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:6% 0 0\">Pasamos un día entero en la casa antes de proponer nada. Anotamos a qué hora entra el sol en cada cuarto, dónde se junta la familia sin darse cuenta, qué mueble nadie querría perder.<\u002Fp>\n        <p style=\"font:300 clamp(10px,1.05vw,12px)/1.95 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:3.5% 0 0\">Después medimos: no sólo paredes, también costumbres. Una mesa que se usa para trabajar de mañana y para comer de noche pide una altura distinta de la que dicta el manual.<\u002Fp>\n        <p style=\"font:200 clamp(15px,1.5vw,22px)/1.45 'Cormorant',serif;font-style:italic;color:rgba(42,38,34,.72);margin:5% 0 0;padding-left:14px;border-left:1px solid rgba(138,106,74,.45)\">Diseñar es sacar lo que sobra hasta que la casa se parezca a quien la habita.<\u002Fp>\n        <p style=\"font:300 clamp(10px,1.05vw,12px)/1.95 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:3.5% 0 0\">Trabajamos con obradores chicos y carpinteros del barrio. La materia prima se elige en persona, pieza por pieza, y se acepta que envejezca.<\u002Fp>\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.36em;color:rgba(42,38,34,.4);margin-top:auto;padding-top:7%\">V<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" style=\"background:#e6dfd0\">\n      <div style=\"height:100%;box-sizing:border-box;padding:14% 12%;display:flex;flex-direction:column;justify-content:center;background:#e6dfd0\">\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.44em;color:#8a6a4a\">CAPÍTULO II · PALERMO SOHO<\u002Fspan>\n        <h2 style=\"font:200 clamp(23px,2.5vw,38px)/1.12 'Cormorant',serif;margin:5% 0 0;color:#2a2622\">Treinta y ocho metros que aprendieron a respirar<\u002Fh2>\n        <p style=\"font:200 clamp(16px,1.7vw,25px)/1.4 'Cormorant',serif;margin:5% 0 0;color:#2a2622\">El departamento venía dividido en cuartos chicos. Sacamos dos tabiques y dejamos que la luz de la tarde cruzara de lado a lado.<\u002Fp>\n        <div style=\"display:flex;gap:26px;margin-top:auto;padding-top:8%;font:300 9px/1.8 'Jost',sans-serif;letter-spacing:.2em;color:rgba(42,38,34,.5)\"><span>38 M²<br>SUPERFICIE<\u002Fspan><span>2024<br>OBRA<\u002Fspan><\u002Fdiv>\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.36em;color:rgba(42,38,34,.4);margin-top:auto;padding-top:7%\">VI<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" style=\"background:#e6dfd0\">\n      <div style=\"height:100%;box-sizing:border-box;padding:12% 12%;display:flex;flex-direction:column;justify-content:flex-start;background:#e6dfd0\">\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.44em;color:#8a6a4a;margin-bottom:6%\">PALERMO SOHO · LA OBRA<\u002Fspan>\n        <p style=\"font:300 clamp(10px,1.05vw,12px)/1.95 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:6% 0 0\">La planta original tenía siete puertas en cuarenta metros. Quedaron tres. El resto del programa se resolvió con un mueble corrido de roble que hace de biblioteca, de vajillero y de cabecera.<\u002Fp>\n        <p style=\"font:300 clamp(10px,1.05vw,12px)/1.95 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:3.5% 0 0\">La cocina perdió su pared y ganó una mesada de piedra que funciona como mesa de trabajo, de desayuno y de reunión. Es el único lugar de la casa donde todo pasa a la vez.<\u002Fp>\n        <p style=\"font:300 clamp(10px,1.05vw,12px)/1.95 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:3.5% 0 0\">Los pisos son los originales, cepillados y sellados con aceite. Se ven las marcas de los tabiques que sacamos: preferimos dejarlas antes que fingir que la casa nació así.<\u002Fp>\n        <p style=\"font:200 clamp(15px,1.5vw,22px)/1.45 'Cormorant',serif;font-style:italic;color:rgba(42,38,34,.72);margin:5% 0 0;padding-left:14px;border-left:1px solid rgba(138,106,74,.45)\">La luz de las seis de la tarde fue el material más caro de esta obra: no se compra, se despeja.<\u002Fp>\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.36em;color:rgba(42,38,34,.4);margin-top:auto;padding-top:7%\">VII<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" style=\"background:#e6dfd0\">\n      <div style=\"height:100%;box-sizing:border-box;padding:10% 9%;display:flex;flex-direction:column;gap:12px;background:#e6dfd0\">\n        <div style=\"flex:1;min-height:0\"><image-slot id=\"tpl-v2-p1\" data-slot-id=\"v2-p1\" shape=\"rect\" placeholder=\"Palermo Soho — living en luz de tarde\" fit=\"cover\" style=\"width:100%;height:100%;display:block\"><\u002Fimage-slot><\u002Fdiv>\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.36em;color:rgba(42,38,34,.45)\">LÁMINA · PALERMO SOHO — VIII<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" style=\"background:#e6dfd0\">\n      <div style=\"height:100%;box-sizing:border-box;padding:10% 9%;display:flex;flex-direction:column;gap:12px;background:#e6dfd0\">\n        <div style=\"flex:1;min-height:0\"><image-slot id=\"tpl-v2-p1b\" data-slot-id=\"v2-p1b\" shape=\"rect\" placeholder=\"Palermo — cocina integrada\" fit=\"cover\" style=\"width:100%;height:100%;display:block\"><\u002Fimage-slot><\u002Fdiv>\n        <div style=\"flex:1;min-height:0\"><image-slot id=\"tpl-v2-p1c\" data-slot-id=\"v2-p1c\" shape=\"rect\" placeholder=\"Palermo — detalle de carpintería\" fit=\"cover\" style=\"width:100%;height:100%;display:block\"><\u002Fimage-slot><\u002Fdiv>\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.36em;color:rgba(42,38,34,.45)\">IX<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" style=\"background:#e6dfd0\">\n      <div style=\"height:100%;box-sizing:border-box;padding:14% 12%;display:flex;flex-direction:column;justify-content:center;background:#e6dfd0\">\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.44em;color:#8a6a4a\">CAPÍTULO III · BELGRANO R<\u002Fspan>\n        <h2 style=\"font:200 clamp(23px,2.5vw,38px)/1.12 'Cormorant',serif;margin:5% 0 0;color:#2a2622\">Una casa de 1937 que no quería ser moderna<\u002Fh2>\n        <p style=\"font:200 clamp(16px,1.7vw,25px)/1.4 'Cormorant',serif;margin:5% 0 0;color:#2a2622\">Restauramos la escalera original y devolvimos la galería al comedor. Lo nuevo se reconoce: no imita lo viejo, lo acompaña.<\u002Fp>\n        <div style=\"display:flex;gap:26px;margin-top:auto;padding-top:8%;font:300 9px/1.8 'Jost',sans-serif;letter-spacing:.2em;color:rgba(42,38,34,.5)\"><span>210 M²<br>SUPERFICIE<\u002Fspan><span>2025<br>OBRA<\u002Fspan><\u002Fdiv>\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.36em;color:rgba(42,38,34,.4);margin-top:auto;padding-top:7%\">X<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" style=\"background:#e6dfd0\">\n      <div style=\"height:100%;box-sizing:border-box;padding:12% 12%;display:flex;flex-direction:column;justify-content:flex-start;background:#e6dfd0\">\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.44em;color:#8a6a4a;margin-bottom:6%\">BELGRANO R · LA OBRA<\u002Fspan>\n        <p style=\"font:300 clamp(10px,1.05vw,12px)/1.95 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:6% 0 0\">La casa había sido dividida en dos departamentos en los años setenta. Reponer la escalera fue devolverle la respiración: recuperamos el pinotea original y repusimos sólo los peldaños partidos.<\u002Fp>\n        <p style=\"font:300 clamp(10px,1.05vw,12px)/1.95 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:3.5% 0 0\">La galería estaba cerrada con aluminio. Volvió a ser galería, con carpintería de madera y vidrio repartido, y el comedor pasó a tener dos horas más de sol por día.<\u002Fp>\n        <p style=\"font:300 clamp(10px,1.05vw,12px)/1.95 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:3.5% 0 0\">Lo nuevo se distingue a propósito: los muebles de guardado son de chapa plegada, mates, sin moldura. Puestos contra la pared de 1937, cada uno explica de qué época es.<\u002Fp>\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.36em;color:rgba(42,38,34,.4);margin-top:auto;padding-top:7%\">XI<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" style=\"background:#e6dfd0\">\n      <div style=\"height:100%;box-sizing:border-box;padding:10% 9%;display:flex;flex-direction:column;gap:12px;background:#e6dfd0\">\n        <div style=\"flex:1;min-height:0\"><image-slot id=\"tpl-v2-p2\" data-slot-id=\"v2-p2\" shape=\"rect\" placeholder=\"Belgrano R — comedor con galería\" fit=\"cover\" style=\"width:100%;height:100%;display:block\"><\u002Fimage-slot><\u002Fdiv>\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.36em;color:rgba(42,38,34,.45)\">LÁMINA · BELGRANO R — XII<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" style=\"background:#e6dfd0\">\n      <div style=\"height:100%;box-sizing:border-box;padding:12% 12%;display:flex;flex-direction:column;justify-content:flex-start;background:#e6dfd0\">\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.44em;color:#8a6a4a;margin-bottom:6%\">BELGRANO R · DETALLE<\u002Fspan>\n        <p style=\"font:300 clamp(10px,1.05vw,12px)/1.95 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:6% 0 0\">Los herrajes de bronce se limpiaron uno por uno y se volvieron a colocar en las mismas puertas. Faltaban cuatro: los hizo un tornero de Villa Ortúzar copiando el original.<\u002Fp>\n        <p style=\"font:200 clamp(15px,1.5vw,22px)/1.45 'Cormorant',serif;font-style:italic;color:rgba(42,38,34,.72);margin:5% 0 0;padding-left:14px;border-left:1px solid rgba(138,106,74,.45)\">Restaurar no es volver al día uno: es dejar que se vean los ochenta y ocho años que pasaron.<\u002Fp>\n        <p style=\"font:300 clamp(10px,1.05vw,12px)/1.95 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:3.5% 0 0\">La cocina se pintó de verde profundo para que la luz del patio, que entra blanca y dura al mediodía, se apoye en algo. Es el único color saturado de la casa.<\u002Fp>\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.36em;color:rgba(42,38,34,.4);margin-top:auto;padding-top:7%\">XIII<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" style=\"background:#e6dfd0\">\n      <div style=\"height:100%;box-sizing:border-box;padding:14% 12%;display:flex;flex-direction:column;justify-content:center;background:#e6dfd0\">\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.44em;color:#8a6a4a\">CAPÍTULO IV · RECOLETA<\u002Fspan>\n        <h2 style=\"font:200 clamp(23px,2.5vw,38px)/1.12 'Cormorant',serif;margin:5% 0 0;color:#2a2622\">Un escritorio frente al parque<\u002Fh2>\n        <p style=\"font:200 clamp(16px,1.7vw,25px)/1.4 'Cormorant',serif;margin:5% 0 0;color:#2a2622\">Las cortinas de lino se eligieron midiendo la sombra sobre el escritorio a lo largo de un día entero.<\u002Fp>\n        <div style=\"display:flex;gap:26px;margin-top:auto;padding-top:8%;font:300 9px/1.8 'Jost',sans-serif;letter-spacing:.2em;color:rgba(42,38,34,.5)\"><span>96 M²<br>SUPERFICIE<\u002Fspan><span>2026<br>OBRA<\u002Fspan><\u002Fdiv>\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.36em;color:rgba(42,38,34,.4);margin-top:auto;padding-top:7%\">XIV<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" style=\"background:#e6dfd0\">\n      <div style=\"height:100%;box-sizing:border-box;padding:12% 12%;display:flex;flex-direction:column;justify-content:flex-start;background:#e6dfd0\">\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.44em;color:#8a6a4a;margin-bottom:6%\">RECOLETA · LA OBRA<\u002Fspan>\n        <p style=\"font:300 clamp(10px,1.05vw,12px)/1.95 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:6% 0 0\">El pedido era simple y difícil: un lugar para leer sin que nadie interrumpa, dentro de una casa donde viven cuatro personas. Lo resolvimos con una biblioteca que hace de pared.<\u002Fp>\n        <p style=\"font:300 clamp(10px,1.05vw,12px)/1.95 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:3.5% 0 0\">El escritorio se apoya contra la ventana, en el eje del parque. La mesa es de roble macizo, sin cajones: todo lo que se guarda se guarda detrás, para que la superficie quede libre.<\u002Fp>\n        <p style=\"font:300 clamp(10px,1.05vw,12px)/1.95 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:3.5% 0 0\">Las lámparas se eligieron después de la mudanza, ya con los libros puestos. Iluminar antes de saber qué hay sobre la mesa es adivinar.<\u002Fp>\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.36em;color:rgba(42,38,34,.4);margin-top:auto;padding-top:7%\">XV<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" style=\"background:#e6dfd0\">\n      <div style=\"height:100%;box-sizing:border-box;padding:10% 9%;display:flex;flex-direction:column;gap:12px;background:#e6dfd0\">\n        <div style=\"flex:1;min-height:0\"><image-slot id=\"tpl-v2-p3\" data-slot-id=\"v2-p3\" shape=\"rect\" placeholder=\"Recoleta — biblioteca y lino\" fit=\"cover\" style=\"width:100%;height:100%;display:block\"><\u002Fimage-slot><\u002Fdiv>\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.36em;color:rgba(42,38,34,.45)\">LÁMINA · RECOLETA — XVI<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" style=\"background:#e6dfd0\">\n      <div style=\"height:100%;box-sizing:border-box;padding:12% 12%;display:flex;flex-direction:column;justify-content:flex-start;background:#e6dfd0\">\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.44em;color:#8a6a4a;margin-bottom:6%\">MATERIALES<\u002Fspan>\n        <p style=\"font:200 clamp(16px,1.7vw,25px)/1.4 'Cormorant',serif;margin:5% 0 0;color:#2a2622\">Cuatro materiales que envejecen mejor de lo que llegan.<\u002Fp>\n        <p style=\"font:300 clamp(10px,1.05vw,12px)/1.95 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:6% 0 0\">Roble macizo, aceitado y no lacado: se raya, se repara con un trapo y sigue. Piedra Mar del Plata en mesadas, porque la mancha de aceite se vuelve parte del dibujo.<\u002Fp>\n        <p style=\"font:300 clamp(10px,1.05vw,12px)/1.95 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:3.5% 0 0\">Lino sin blanquear en cortinas y tapizados: arruga, y esa arruga es la que hace que una casa se vea habitada. Hormigón visto sólo donde ya estaba.<\u002Fp>\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.36em;color:rgba(42,38,34,.4);margin-top:auto;padding-top:7%\">XVII<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" style=\"background:#e6dfd0\">\n      <div style=\"height:100%;box-sizing:border-box;padding:12% 10%;display:flex;flex-direction:column;justify-content:center;background:#e6dfd0\">\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.44em;color:#8a6a4a;margin-bottom:6%\">MATERIALES · LÁMINAS<\u002Fspan>\n        <div style=\"flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:10px\">\n          <div style=\"min-width:0;min-height:0;overflow:hidden\"><image-slot id=\"tpl-v2-m1\" data-slot-id=\"v2-m1\" shape=\"rect\" placeholder=\"Roble\" fit=\"cover\" style=\"width:100%;height:100%;display:block\"><\u002Fimage-slot><\u002Fdiv>\n          <div style=\"min-width:0;min-height:0;overflow:hidden\"><image-slot id=\"tpl-v2-m2\" data-slot-id=\"v2-m2\" shape=\"rect\" placeholder=\"Piedra\" fit=\"cover\" style=\"width:100%;height:100%;display:block\"><\u002Fimage-slot><\u002Fdiv>\n          <div style=\"min-width:0;min-height:0;overflow:hidden\"><image-slot id=\"tpl-v2-m3\" data-slot-id=\"v2-m3\" shape=\"rect\" placeholder=\"Lino\" fit=\"cover\" style=\"width:100%;height:100%;display:block\"><\u002Fimage-slot><\u002Fdiv>\n          <div style=\"min-width:0;min-height:0;overflow:hidden\"><image-slot id=\"tpl-v2-m4\" data-slot-id=\"v2-m4\" shape=\"rect\" placeholder=\"Hormigón\" fit=\"cover\" style=\"width:100%;height:100%;display:block\"><\u002Fimage-slot><\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.36em;color:rgba(42,38,34,.4);margin-top:6%\">XVIII<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" style=\"background:#e6dfd0\">\n      <div style=\"height:100%;box-sizing:border-box;padding:14% 12%;display:flex;flex-direction:column;justify-content:center;text-align:center;align-items:center;background:#e6dfd0\">\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.44em;color:#8a6a4a\">COLOFÓN<\u002Fspan>\n        <p style=\"font:200 clamp(18px,1.9vw,28px)/1.4 'Cormorant',serif;margin:6% 0 0;max-width:26ch;color:#2a2622\">Si querés que tu casa cuente algo, escribinos.<\u002Fp>\n        <p style=\"font:300 11px/2 'Jost',sans-serif;color:rgba(42,38,34,.62);margin:6% 0 0\">HABITARTE — Buenos Aires<br>hola@habitarte.com.ar<\u002Fp>\n        <span style=\"font:300 8px/1 'Jost',sans-serif;letter-spacing:.36em;color:rgba(42,38,34,.4);margin-top:auto;padding-top:8%\">XIX<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-pg=\"\" data-density=\"hard\" data-cover=\"\" style=\"background:#5c1a22\">\n      <div style=\"height:100%;box-sizing:border-box;padding:12%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;background:linear-gradient(80deg,#45121a 0%,#5c1a22 45%,#4e151c 100%)\">\n        <img src=\"3f8aa1eb-e3d7-4754-a77d-760f50fcb987\" alt=\"Habitarte\" style=\"width:min(120px,40%);aspect-ratio:1/1;height:auto;display:block;opacity:.8;object-fit:contain\">\n        <span style=\"font:300 8px/1.9 'Jost',sans-serif;letter-spacing:.34em;color:rgba(240,235,226,.45)\">© MMXXVI HABITARTE<br>TU ESPACIO, TU ESENCIA<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;vista&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Frente&quot;,&quot;Tres cuartos al cerrar&quot;,&quot;Tres cuartos siempre&quot;,&quot;Tres cuartos, bloque de hojas&quot;],&quot;default&quot;:&quot;Tres cuartos al cerrar&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Volumen&quot;},&quot;espesor&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:72,&quot;min&quot;:10,&quot;max&quot;:120,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Volumen&quot;},&quot;pliegue&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.6,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Volumen&quot;},&quot;flipSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:860,&quot;min&quot;:420,&quot;max&quot;:1400,&quot;step&quot;:20,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Giro&quot;},&quot;shadow&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.22,&quot;min&quot;:0,&quot;max&quot;:0.5,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Giro&quot;},&quot;musicUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Música&quot;}}\">\nconst ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX'];\nconst RATIO = 0.72;   // ancho/alto de una hoja\nconst SHIFT_EASE = 'transform .55s cubic-bezier(.4,0,.2,1)';\n\nconst EN = {\n  'ÍNDICE': 'CONTENTS',\n  'Buenos Aires — tres casas, una manera de mirar.': 'Buenos Aires — three homes, one way of looking.',\n  'Antes de dibujar, escuchamos': 'Before drawing, we listen',\n  'Colofón y contacto': 'Colophon and contact',\n  'PRÓLOGO': 'PROLOGUE',\n  'Una casa no se decora: se interpreta. Observamos la luz, los hábitos y los silencios antes de dibujar una sola línea.': 'A home is not decorated: it is interpreted. We watch the light, the habits and the silences before drawing a single line.',\n  'Tres viviendas de Buenos Aires contadas como se cuentan las historias: por la luz que entra, por las manos que las hicieron y por la gente que las gastó.': 'Three Buenos Aires homes told the way stories are told: by the light that enters, the hands that built them and the people who wore them in.',\n  'La casa antes del plano': 'The home before the drawing',\n  'VOLUMEN I · MMXXVI': 'VOLUME I · MMXXVI',\n  'CAPÍTULO II · PALERMO SOHO': 'CHAPTER II · PALERMO SOHO',\n  'Treinta y ocho metros que aprendieron a respirar': 'Thirty-eight metres that learned to breathe',\n  'El departamento venía dividido en cuartos chicos. Sacamos dos tabiques y dejamos que la luz de la tarde cruzara de lado a lado.': 'The flat came split into small rooms. We removed two partitions and let the afternoon light cross from side to side.',\n  'CAPÍTULO III · BELGRANO R': 'CHAPTER III · BELGRANO R',\n  'Una casa de 1937 que no quería ser moderna': 'A 1937 house that did not want to be modern',\n  'Restauramos la escalera original y devolvimos la galería al comedor. Lo nuevo se reconoce: no imita lo viejo, lo acompaña.': 'We restored the original staircase and gave the gallery back to the dining room. What is new shows itself: it does not imitate the old, it accompanies it.',\n  'CAPÍTULO IV · RECOLETA': 'CHAPTER IV · RECOLETA',\n  'Un escritorio frente al parque': 'A desk facing the park',\n  'Las cortinas de lino se eligieron midiendo la sombra sobre el escritorio a lo largo de un día entero.': 'The linen curtains were chosen by measuring the shadow on the desk across a whole day.',\n  'MATERIALES': 'MATERIALS',\n  'MATERIALES · COLOFÓN': 'MATERIALS · COLOPHON',\n  'Cuatro materiales que envejecen mejor de lo que llegan.': 'Four materials that age better than they arrive.',\n  'COLOFÓN': 'COLOPHON',\n  'Si querés que tu casa cuente algo, escribinos.': 'If you want your home to tell something, write to us.',\n  'ARRASTRÁ LA ESQUINA DE LA HOJA': 'DRAG THE CORNER OF THE PAGE',\n  '← ANTERIOR': '← PREVIOUS',\n  'SIGUIENTE →': 'NEXT →',\n  'SUPERFICIE': 'FLOOR AREA',\n  'OBRA': 'BUILT',\n  'LÁMINA · PALERMO SOHO — VIII': 'PLATE · PALERMO SOHO — VIII',\n  'LÁMINA · BELGRANO R — XII': 'PLATE · BELGRANO R — XII',\n  'LÁMINA · RECOLETA — XVI': 'PLATE · RECOLETA — XVI',\n  'Materiales, colofón y contacto': 'Materials, colophon and contact',\n  'Ninguna empezó con un plano. Empezaron con una conversación larga, en la cocina, sobre cómo querían vivir sus dueños dentro de diez años.': 'None began with a drawing. They began with a long kitchen conversation about how their owners wanted to live ten years from now.',\n  'ANTES DE DIBUJAR, ESCUCHAMOS': 'BEFORE DRAWING, WE LISTEN',\n  'Pasamos un día entero en la casa antes de proponer nada. Anotamos a qué hora entra el sol en cada cuarto, dónde se junta la familia sin darse cuenta, qué mueble nadie querría perder.': 'We spend a whole day in the house before proposing anything. We note when the sun reaches each room, where the family gathers without noticing, which piece of furniture no one would give up.',\n  'Después medimos: no sólo paredes, también costumbres. Una mesa que se usa para trabajar de mañana y para comer de noche pide una altura distinta de la que dicta el manual.': 'Then we measure: not only walls, also habits. A table used for work in the morning and dinner at night asks for a height no manual prescribes.',\n  'Diseñar es sacar lo que sobra hasta que la casa se parezca a quien la habita.': 'To design is to remove what is excess until the house resembles whoever lives in it.',\n  'Trabajamos con obradores chicos y carpinteros del barrio. La materia prima se elige en persona, pieza por pieza, y se acepta que envejezca.': 'We work with small builders and neighbourhood carpenters. Materials are chosen in person, piece by piece, and allowed to age.',\n  'PALERMO SOHO · LA OBRA': 'PALERMO SOHO · THE WORK',\n  'La planta original tenía siete puertas en cuarenta metros. Quedaron tres. El resto del programa se resolvió con un mueble corrido de roble que hace de biblioteca, de vajillero y de cabecera.': 'The original plan had seven doors in forty metres. Three remain. The rest was solved with one long oak unit that works as bookcase, china cabinet and headboard.',\n  'La cocina perdió su pared y ganó una mesada de piedra que funciona como mesa de trabajo, de desayuno y de reunión. Es el único lugar de la casa donde todo pasa a la vez.': 'The kitchen lost its wall and gained a stone counter that works as desk, breakfast table and meeting point. It is the one place where everything happens at once.',\n  'Los pisos son los originales, cepillados y sellados con aceite. Se ven las marcas de los tabiques que sacamos: preferimos dejarlas antes que fingir que la casa nació así.': 'The floors are original, brushed and oil-sealed. The scars of the removed partitions show: we would rather keep them than pretend the flat was born this way.',\n  'La luz de las seis de la tarde fue el material más caro de esta obra: no se compra, se despeja.': 'Six-o-clock light was the most expensive material here: you do not buy it, you clear the way for it.',\n  'BELGRANO R · LA OBRA': 'BELGRANO R · THE WORK',\n  'La casa había sido dividida en dos departamentos en los años setenta. Reponer la escalera fue devolverle la respiración: recuperamos el pinotea original y repusimos sólo los peldaños partidos.': 'The house had been split into two flats in the seventies. Restoring the staircase gave it back its breath: we recovered the original pine and replaced only the broken treads.',\n  'La galería estaba cerrada con aluminio. Volvió a ser galería, con carpintería de madera y vidrio repartido, y el comedor pasó a tener dos horas más de sol por día.': 'The gallery had been closed with aluminium. It is a gallery again, in timber with divided glazing, and the dining room gained two more hours of sun a day.',\n  'Lo nuevo se distingue a propósito: los muebles de guardado son de chapa plegada, mates, sin moldura. Puestos contra la pared de 1937, cada uno explica de qué época es.': 'The new declares itself: storage is folded sheet metal, matte, without moulding. Against the 1937 wall, each piece states its own date.',\n  'BELGRANO R · DETALLE': 'BELGRANO R · DETAIL',\n  'Los herrajes de bronce se limpiaron uno por uno y se volvieron a colocar en las mismas puertas. Faltaban cuatro: los hizo un tornero de Villa Ortúzar copiando el original.': 'The brass hardware was cleaned piece by piece and returned to the same doors. Four were missing: a turner in Villa Ortúzar made them from the original.',\n  'Restaurar no es volver al día uno: es dejar que se vean los ochenta y ocho años que pasaron.': 'To restore is not to return to day one: it is to let the eighty-eight years show.',\n  'La cocina se pintó de verde profundo para que la luz del patio, que entra blanca y dura al mediodía, se apoye en algo. Es el único color saturado de la casa.': 'The kitchen was painted deep green so the courtyard light, white and hard at noon, has something to rest on. It is the only saturated colour in the house.',\n  'RECOLETA · LA OBRA': 'RECOLETA · THE WORK',\n  'El pedido era simple y difícil: un lugar para leer sin que nadie interrumpa, dentro de una casa donde viven cuatro personas. Lo resolvimos con una biblioteca que hace de pared.': 'The brief was simple and hard: a place to read uninterrupted inside a home for four. We solved it with a bookcase that works as a wall.',\n  'El escritorio se apoya contra la ventana, en el eje del parque. La mesa es de roble macizo, sin cajones: todo lo que se guarda se guarda detrás, para que la superficie quede libre.': 'The desk sits against the window, on the axis of the park. Solid oak, no drawers: everything stored is stored behind, so the surface stays clear.',\n  'Las lámparas se eligieron después de la mudanza, ya con los libros puestos. Iluminar antes de saber qué hay sobre la mesa es adivinar.': 'The lamps were chosen after the move, with the books already in place. Lighting before knowing what sits on the table is guesswork.',\n  'Roble macizo, aceitado y no lacado: se raya, se repara con un trapo y sigue. Piedra Mar del Plata en mesadas, porque la mancha de aceite se vuelve parte del dibujo.': 'Solid oak, oiled not lacquered: it scratches, a cloth repairs it, it carries on. Mar del Plata stone on counters, because an oil stain becomes part of the pattern.',\n  'Lino sin blanquear en cortinas y tapizados: arruga, y esa arruga es la que hace que una casa se vea habitada. Hormigón visto sólo donde ya estaba.': 'Unbleached linen for curtains and upholstery: it creases, and that crease is what makes a home look lived in. Exposed concrete only where it already was.',\n  'MATERIALES · LÁMINAS': 'MATERIALS · PLATES',\n  'TU ESPACIO, TU ESENCIA': 'YOUR SPACE, YOUR ESSENCE',\n};\n\nclass Component extends DCLogic {\n  state = {};\n\n  componentDidMount() {\n    this.wait();\n    addEventListener('keydown',  mk('lomo', 'left:' + x + 'px;top:0;width:' + T + 'px;height:' + g.ph + 'px;'\n      + 'transform-origin:left center;transform:rotateY(-90deg) translateX(-' + T + 'px);'\n      + 'background:linear-gradient(90deg,#43121c 0%,#7d2733 34%,#94333f 58%,#6b1f29 82%,#3c1018 100%);'\n      + 'box-shadow:inset -1px 0 0 rgba(240,235,226,.28), inset 1px 0 0 rgba(0,0,0,.5);'\n      + 'display:flex;align-items:center;justify-content:center;overflow:hidden');\n    if (T >= 64) {\n      const lb = document.createElement('span');\n      lb.textContent = 'HABITARTE';\n      lb.style.cssText = 'writing-mode:vertical-rl;font:300 ' + Math.max(6, Math.min(9, Math.round(T * 0.26)))\n        + 'px/1 Jost,sans-serif;letter-spacing:.34em;color:rgba(240,235,226,.5);white-space:nowrap';\n      sp.appendChild(lb);\n    }\n  };\n\n  // ---- pliegue del libro abierto (item 4) ----\n  ensureFold = () => {\n    const g = this.geo;\n    if (!g || g.single || !this.tiltEl) return;\n    let f = this.tiltEl.querySelector('[data-fold]');\n    if (!f) { f = document.createElement('div'); f.setAttribute('data-fold', ''); this.tiltEl.appendChild(f); }\n    const k = Math.max(0, Math.min(1, this.props.pliegue ?? 0.6));\n    const a = (v) => (v * k).toFixed(3);\n    f.style.cssText = 'position:absolute;top:0;height:100%;left:' + (g.pw - 17) + 'px;width:34px;'\n      + 'pointer-events:none;z-index:7;opacity:0;transition:opacity .3s ease;'\n      + 'background:linear-gradient(90deg,rgba(22,18,15,0) 0%,rgba(22,18,15,' + a(0.14) + ') 26%,'\n      + 'rgba(22,18,15,' + a(0.4) + ') 44%,rgba(22,18,15,' + a(0.7) + ') 50%,'\n      + 'rgba(22,18,15,' + a(0.4) + ') 56%,rgba(22,18,15,' + a(0.14) + ') 74%,rgba(22,18,15,0) 100%)';\n    this.foldEl = f;\n  };\n\n  visCount = () => {\n    if (!this.stageEl) return 0;\n    return [...this.stageEl.querySelectorAll('.stf__item')]\n      .filter((n) => n.getBoundingClientRect().width > 1).length;\n  };\n\n  // la perspectiva vive en reposo: al tomar la hoja el libro se endereza y el arrastre queda a plomo\n  applyDepth = () => {\n    const g = this.geo;\n    if (!g || !this.tiltEl) return;\n    const vista = this.props.vista || 'Tres cuartos al cerrar';\n    const i = this.currentIndex();\n    const n = this.total();\n    const back = i >= n - 1;\n    const closed = i <= 0 || back;\n    // el aviso de \"está girando\" puede quedar colgado: sólo vale si es reciente\n    const busy = this.flipping && performance.now() - (this.stateT || 0) < 1200;\n    const boca = vista.indexOf('bloque') >= 0;\n    let mag = 0;\n    if (!g.single && vista !== 'Frente') {\n      mag = closed ? 27 : (vista === 'Tres cuartos siempre' ? 12 : 0);\n      if (busy) mag = vista === 'Tres cuartos siempre' ? 12 : 0;\n    }\n    // positivo lleva el lomo al frente; en la contratapa el lomo cae del otro lado\n    // del pliego, así que el giro se invierte para seguir mostrando la misma cara\n    const a = mag * (boca ? -1 : 1) * (back ? -1 : 1);\n    this.tiltEl.style.transform = 'rotateY(' + a + 'deg)';\n    // los cantos están construidos sobre la tapa: en la contratapa no aplican\n    const show = i <= 0 && !busy && mag > 12;\n    const side = boca ? 'boca' : 'lomo';\n    this.tiltEl.querySelectorAll('[data-edge]').forEach((el) => {\n      el.style.opacity = (show && el.getAttribute('data-edge') === side) ? '1' : '0';\n    });\n    if (this.foldEl) this.foldEl.style.opacity = (!g.single && !closed && !busy) ? '1' : '0';\n  };\n\n  // ---- teclado (item 2) ----\n  onKey = (e) => {\n    if (e.metaKey || e.ctrlKey || e.altKey) return;\n    const t = e.target;\n    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;\n    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); this.step(1); }\n    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); this.step(-1); }\n  };\n\n  // ---- modo día / noche (item 6) ----\n  applyNight = () => {\n    const s = this.shellEl;\n    const day = this.night === false;\n    this.day = day;\n    if (s) {\n      s.style.background = day\n        ? 'radial-gradient(120% 100% at 50% 0%, #e7dfd1 0%, #d3c8b5 55%, #b6a893 100%)'\n        : 'radial-gradient(120% 100% at 50% 0%, #221d19 0%, #171412 60%, #0f0d0b 100%)';\n      s.style.color = day ? '#241f1a' : '#e6dfd0';\n    }\n    // el membrete es crema monocromo: sobre luz de día hay que apagarlo a silueta\n    if (this.logoEl) {\n      this.logoEl.style.filter = day ? 'brightness(0)' : 'none';\n      this.logoEl.style.opacity = day ? '.7' : '.85';\n    }\n    this.tuneChrome(day);\n    this.paintFolio();\n    if (this.lang) this.applyLang(this.lang);\n    const sh = this.stageEl && this.stageEl.querySelector('[data-desk-shadow]');\n    if (sh) sh.style.background = day ? 'rgba(88,70,54,.34)' : 'rgba(0,0,0,.55)';\n    if (this.nightEl) {\n      const m = this.nightEl.querySelector('[data-ico=\"moon\"]');\n      const su = this.nightEl.querySelector('[data-ico=\"sun\"]');\n      if (m) m.style.display = day ? 'none' : 'block';\n      if (su) su.style.display = day ? 'block' : 'none';\n    }\n  };\n\n  toggleNight = () => { this.night = this.night === false; this.applyNight(); };\n\n  // las opacidades bajas se leen sobre el escritorio oscuro, no sobre luz de día\n  tuneChrome = (day) => {\n    const s = this.shellEl;\n    if (!s) return;\n    s.querySelectorAll('[data-topbar] span, [data-footer] span, [data-navbtn]').forEach((n) => {\n      if (n.hasAttribute('data-chap') || n.hasAttribute('data-lang')) return;\n      if (!n.dataset.o0) n.dataset.o0 = String(parseFloat(getComputedStyle(n).opacity) || 1);\n      const base = parseFloat(n.dataset.o0);\n      n.style.opacity = String(day ? Math.min(1, base * 2.1) : base);\n    });\n  };\n\n  // ---- música (item 6) ----\n  paintMusic = () => {\n    const el = this.musicEl;\n    if (!el) return;\n    const url = (this.props.musicUrl || '').trim();\n    el.style.opacity = this.playing ? '1' : (url ? '.55' : '.26');\n    const on = el.querySelector('[data-ico=\"note\"]');\n    const off = el.querySelector('[data-ico=\"noteoff\"]');\n    if (on) on.style.display = this.playing ? 'block' : 'none';\n    if (off) off.style.display = this.playing ? 'none' : 'block';\n  };\n\n  fadeAudio = (to, done) => {\n    const a = this.audioEl;\n    if (!a) return;\n    clearInterval(this.fadeT);\n    this.fadeT = setInterval(() => {\n      const d = to - a.volume;\n      if (Math.abs(d) < 0.02) { a.volume = to; clearInterval(this.fadeT); if (done) done(); return; }\n      a.volume = Math.max(0, Math.min(1, a.volume + d * 0.18));\n    }, 40);\n  };\n\n  toggleMusic = () => {\n    const a = this.audioEl;\n    const url = (this.props.musicUrl || '').trim();\n    if (!a || !url) {\n      // sin archivo no hay nada que sonar: el control avisa y se apaga solo\n      if (this.musicEl) { this.musicEl.style.opacity = '.7'; setTimeout(this.paintMusic, 800); }\n      return;\n    }\n    if (a.getAttribute('src') !== url) { a.setAttribute('src', url); a.loop = true; }\n    if (this.playing) {\n      this.playing = false;\n      this.fadeAudio(0, () => { try { a.pause(); } catch (e) {} });\n    } else {\n      this.playing = true;\n      a.volume = 0;\n      const p = a.play();\n      if (p && p.catch) p.catch(() => { this.playing = false; this.paintMusic(); });\n      this.fadeAudio(0.3);\n    }\n    this.paintMusic();\n  };\n\n  onResize = () => {\n    clearTimeout(this.rt);\n    this.rt = setTimeout(() => {\n      const lib = window.St && window.St.PageFlip;\n      if (lib) this.build(lib, true);\n    }, 220);\n  };\n\n  step = (dir) => {\n    const f = this.flip;\n    if (!f) return;\n    // el índice de la librería puede ir por delante de lo dibujado: el límite se\n    // mide sobre la hoja que de verdad se está viendo\n    const from = this.currentIndex();\n    const total = this.total();\n    if (dir < 0 && from <= 0) return;                 // en la tapa, ANTERIOR no abre el libro\n    if (dir > 0 && from >= total - 1) return;         // en la contratapa, SIGUIENTE no vuelve\n    // dos clics encimados encadenan dos hojas: un clic por giro\n    if (this.navLock) return;\n    this.navLock = true;\n    clearTimeout(this.navLockT);\n    this.navLockT = setTimeout(() => { this.navLock = false; }, 300);\n    // flipNext/flipPrev son relativos al índice interno de la librería, que después de\n    // un salto de capítulo queda desfasado: ANTERIOR podía terminar avanzando.\n    // Navegamos por índice absoluto, calculado sobre la hoja que de verdad se está viendo\n    const stepN = (this.geo && this.geo.single) ? 1 : 2;\n    let want = from + dir * stepN;\n    if (!(this.geo && this.geo.single) && want > 0 && want % 2 === 0) want -= 1;   // el pliego se lee desde la impar\n    want = Math.max(0, Math.min(total - 1, want));\n    this.pageAt = want;\n    try { f.flip(want, 'top'); } catch (e) { try { f.turnToPage(want); } catch (e2) {} }\n    // si el giro animado no salió (el reloj de la librería no siempre arranca), cerramos\n    // sobre la MISMA hoja destino: la red de seguridad no puede cambiar de dirección\n    clearTimeout(this.ensureT);\n    this.ensureT = setTimeout(() => {\n      if (this.drawnIndex() === want) return;\n      try { f.turnToPage(want); } catch (e) {}\n      this.paintNow();\n      this.paintFolio();\n      this.center();\n    }, 640);\n    [60, 200, 620, 1000, 1400].forEach((ms) => setTimeout(() => { this.paintNow(); this.paintFolio(); this.center(); }, ms));\n  };\n\n  // salto directo a un capítulo: la hoja destino se lee a la izquierda del pliego\n  goTo = (i) => {\n    const f = this.flip;\n    if (!f) return;\n    const target = (this.geo && this.geo.single) ? i : (i % 2 === 1 ? i : i - 1);   // en hoja única el índice es exacto\n    const want = Math.max(0, target);\n    this.pageAt = want;\n    try { f.flip(want, 'top'); } catch (e) { try { f.turnToPage(want); } catch (e2) {} }\n    // un salto de varios pliegos se queda a mitad de camino: lo cerramos sin animar\n    const settle = () => {\n      if (this.drawnIndex() === want) return;\n      try { f.turnToPage(want); } catch (e) {}\n      this.paintNow();\n    };\n    [900, 1300].forEach((ms) => setTimeout(settle, ms));\n    [80, 300, 700, 1000, 1400, 1900, 2500].forEach((ms) => setTimeout(() => { this.paintNow(); this.paintFolio(); this.center(); }, ms));\n  };\n\n  drawnIndex = () => {\n    if (!this.pageEls) return 0;\n    let best = -1, bestX = Infinity;\n    this.pageEls.forEach((el, i) => {\n      const r = el.getBoundingClientRect();\n      if (r.width < 1) return;\n      if (r.left < bestX) { bestX = r.left; best = i; }\n    });\n    return best < 0 ? 0 : best;\n  };\n\n  paintNow = () => {\n    const f = this.flip;\n    if (!f || !f.render) return;\n    // si el navegador entrega frames, el bucle de la librería ya dibuja: un\n    // update() extra a mitad del giro recalcula tamaños y salta la animación\n    if (performance.now() - (this.lastRaf || 0) < 250) return;\n    try { f.render.update(); f.render.drawFrame(performance.now()); } catch (e) {}\n  };\n\n  paintFolio = () => {\n    if (!this.flip) return;\n    const i = this.currentIndex();\n    const total = ROMAN.length;\n    if (this.folioEl) this.folioEl.textContent = (ROMAN[Math.min(total - 1, i)] || '') + ' / ' + ROMAN[total - 1];\n    // el capítulo abierto queda encendido: el rótulo más alto que ya se pasó\n    if (this.chapEl) {\n      const marks = [...this.chapEl.querySelectorAll('[data-chap]')];\n      let act = -1;\n      marks.forEach((m, k) => { if (i >= +m.dataset.chap) act = k; });\n      const dim = this.day ? '.82' : '.58';\n      marks.forEach((m, k) => { m.style.opacity = k === act ? '1' : dim; });\n    }\n  };\n\n  setLang = (lang) => { if (this.lang !== lang) this.applyLang(lang); };\n\n  seedOriginals = (root) => {\n    if (!this.orig) this.orig = new Map();\n    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);\n    while (w.nextNode()) {\n      const n = w.currentNode;\n      if (n.nodeValue.trim() && !this.orig.has(n)) this.orig.set(n, n.nodeValue);\n    }\n  };\n\n  applyLang = (lang) => {\n    this.lang = lang;\n    if (!this.orig) this.orig = new Map();\n    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {\n      acceptNode: (n) => (this.srcEl && this.srcEl.contains(n))\n        ? NodeFilter.FILTER_REJECT\n        : NodeFilter.FILTER_ACCEPT,\n    });\n    const nodes = [];\n    while (walker.nextNode()) nodes.push(walker.currentNode);\n    nodes.forEach((n) => {\n      const raw = this.orig.has(n) ? this.orig.get(n) : n.nodeValue;\n      const key = raw.trim();\n      if (!key) return;\n      if (!this.orig.has(n)) this.orig.set(n, raw);\n      n.nodeValue = lang === 'en' ? (EN[key] || key) : raw;\n    });\n    document.querySelectorAll('[data-lang]').forEach((n) => {\n      n.style.opacity = n.dataset.lang === lang ? '1' : (this.day ? '.72' : '.5');\n    });\n    this.paintFolio();\n  };\n\n  renderVals() {\n    return {\n      stageRef: (el) => { this.stageEl = el; if (el) this.wait(); },\n      srcRef: (el) => {\n        this.srcEl = el;\n        if (!el) return;\n        if (this.flip && this.sig && this.signature() !== this.sig) {\n          clearTimeout(this.rebuildT);\n          this.rebuildT = setTimeout(() => { const lib = window.St && window.St.PageFlip; if (lib) this.build(lib, true); }, 300);\n        } else {\n          this.wait();\n        }\n      },\n      logoRef: (el) => { this.logoEl = el; if (el) this.applyNight(); },\n      folioRef: (el) => { this.folioEl = el; },\n      chapBarRef: (el) => {\n        this.chapEl = el;\n        if (!el || el.dataset.bound) return;\n        // el clic se escucha en la barra: sobrevive a cada rearmado del libro\n        el.dataset.bound = '1';\n        el.addEventListener('click', (ev) => {\n          const t = ev.target.closest('[data-chap]');\n          if (t) this.goTo(+t.dataset.chap);\n        });\n      },\n      shellRef: (el) => { this.shellEl = el; if (el) this.applyNight(); },\n      nightRef: (el) => { this.nightEl = el; if (el) this.applyNight(); },\n      musicRef: (el) => { this.musicEl = el; if (el) this.paintMusic(); },\n      audioRef: (el) => { this.audioEl = el; },\n      toggleNight: () => this.toggleNight(),\n      toggleMusic: () => this.toggleMusic(),\n      prev: () => this.step(-1),\n      next: () => this.step(1),\n      setEs: () => this.setLang('es'),\n      setEn: () => this.setLang('en'),\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
