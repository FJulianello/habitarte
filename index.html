<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colección Interior — los libros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,200;0,300;1,200;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#1c1815;color:#e8e1d4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(28px,5vh,56px);padding:clamp(28px,6vw,72px) clamp(20px,5vw,60px);font-family:'Jost',sans-serif}
  a{color:#e8dcc8;text-decoration:none}
  a:hover{color:#fff}
  h1{font:200 clamp(30px,5vw,54px)/1.1 'Cormorant',serif;letter-spacing:.03em;margin:0;text-align:center}
  h1 em{font-style:italic}
  .sub{font:300 9px/1 'Jost',sans-serif;letter-spacing:.42em;color:rgba(232,225,212,.45);text-align:center;text-transform:uppercase}
  .row{display:flex;flex-wrap:wrap;gap:clamp(18px,2.6vw,34px);justify-content:center;width:100%;max-width:1000px}
  .card{flex:1 1 240px;max-width:300px;min-width:0;display:flex;flex-direction:column;gap:16px;padding:clamp(22px,2.4vw,32px);border:1px solid rgba(232,225,212,.14);background:linear-gradient(80deg,#2a2622,#221e1b);transition:border-color .4s ease,transform .4s ease}
  .card:hover{border-color:rgba(232,220,200,.42);transform:translateY(-4px)}
  .spine{width:34px;height:1px;background:#7d2733}
  .name{font:200 clamp(21px,2.3vw,30px)/1.2 'Cormorant',serif}
  .name em{font-style:italic;display:block}
  .go{font:400 8px/1 'Jost',sans-serif;letter-spacing:.34em;color:rgba(232,225,212,.5);text-transform:uppercase}
  footer{font:300 8px/1.9 'Jost',sans-serif;letter-spacing:.3em;color:rgba(232,225,212,.3);text-align:center;text-transform:uppercase}
</style>
</head>
<body>
  <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
    <span class="sub">tu espacio, tu esencia</span>
    <h1>Los <em>libros</em></h1>
  </div>
  <div class="row">
    <a class="card" href="coleccion-interior.html">
      <span class="spine"></span>
      <span class="name">colección <em>interior</em></span>
      <span class="go">abrir</span>
    </a>
    <a class="card" href="mi-coleccion-interior.html">
      <span class="spine"></span>

    <a class="card" href="tu-coleccion-interior.html">
      <span class="spine"></span>
      <span class="name">tu colección <em>interior</em></span>
      <span class="go">abrir</span>
    </a>
  </div>
  <footer>© MMXXVI — Buenos Aires</footer>
</body>
</html>
